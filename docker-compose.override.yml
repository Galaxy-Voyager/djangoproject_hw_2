version: '3.8'

services:
  web:
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
      - ./media:/app/media
      - ./static:/app/static
      - ./.env:/app/.env
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      PYTHONUNBUFFERED: "1"

  celery_worker:
    command: celery -A config worker --loglevel=debug --pool=solo
    volumes:
      - .:/app
      - ./.env:/app/.env

  celery_beat:
    command: celery -A config beat --loglevel=debug --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
      - ./.env:/app/.env
